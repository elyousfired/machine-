name: agent1-scan
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4h
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scout.run
      - name: Commit results
        run: |
          git config user.name "agent1-bot"
          git config user.email "agent1-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
